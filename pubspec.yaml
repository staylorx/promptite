name: promptite
description: A command-line prompt tightener for Claude Code and the like — assembles a token-lean task, file and context prompt and reports its token cost.
version: 1.0.0
repository: https://github.com/staylorx/promptite
executables:
  promptite: promptite

environment:
  sdk: '>=3.10.0 <4.0.0'

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  fpdart: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
