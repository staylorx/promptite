name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Test
        run: dart test
      - name: What pub.dev would see
        run: dart pub publish --dry-run

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # One source of truth for Windows validation: `tool/windows_smoke.sh`
      # builds the binary from a clean tree and tests the artifact — the same
      # lane a developer runs by hand, so CI and the local run cannot drift.
      # It owns the build step (including the `mkdir -p build`, which a clean
      # checkout needs because `dart compile exe` does NOT create its output
      # directory while `build/` is gitignored — the compile otherwise dies with
      # `PathNotFoundException: ... build\promptite.exe`; that is how this lane
      # went red at 5b7abf1 while passing on any machine with a stale build/).
      - name: Build and validate the Windows binary
        shell: bash
        run: bash tool/windows_smoke.sh
